<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BrainUp 🧠 — Aqlni rivojlantiruvchi o'yinlar platformasi</title>
  <!-- Google Fonts: Inter & Fredoka (bolalar va zamonaviy UI uchun) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />

  <style>
    /* ==========================================================================
       1. ASOSIY DIZAYN O'ZGARUVCHILARI VA YOSH TOIFALARI MAVZULARI
       ========================================================================== */
    :root {
      --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #312e81 100%);
      --card-bg: rgba(255, 255, 255, 0.08);
      --card-border: rgba(255, 255, 255, 0.16);
      --text-main: #f8fafc;
      --text-muted: #cbd5e1;
      --accent-primary: #6366f1;
      --accent-secondary: #ec4899;
      --accent-glow: rgba(99, 102, 241, 0.45);
      --font-display: 'Fredoka', 'Inter', sans-serif;
      --font-body: 'Inter', sans-serif;
    }

    /* 5-7 yosh: Yorqin, quvnoq va rang-barang */
    body.theme-5-7 {
      --bg-gradient: linear-gradient(135deg, #ff7eb3 0%, #ff758c 35%, #ffb347 75%, #4facfe 100%);
      --card-bg: rgba(255, 255, 255, 0.22);
      --card-border: rgba(255, 255, 255, 0.45);
      --text-main: #1e1b4b;
      --text-muted: #312e81;
      --accent-primary: #ff5722;
      --accent-secondary: #00bcd4;
      --accent-glow: rgba(255, 87, 34, 0.45);
    }

    /* 7-13 yosh: Ko'k, binafsha va yashil ranglar */
    body.theme-7-13 {
      --bg-gradient: linear-gradient(135deg, #1d4ed8 0%, #6d28d9 50%, #059669 100%);
      --card-bg: rgba(255, 255, 255, 0.12);
      --card-border: rgba(255, 255, 255, 0.25);
      --text-main: #ffffff;
      --text-muted: #e0e7ff;
      --accent-primary: #10b981;
      --accent-secondary: #8b5cf6;
      --accent-glow: rgba(16, 185, 129, 0.45);
    }

    /* 13-19 yosh: Zamonaviy, dinamik va texnologik dizayn */
    body.theme-13-19 {
      --bg-gradient: linear-gradient(135deg, #090d16 0%, #111827 45%, #1e1b4b 100%);
      --card-bg: rgba(17, 24, 39, 0.72);
      --card-border: rgba(56, 189, 248, 0.35);
      --text-main: #f1f5f9;
      --text-muted: #94a3b8;
      --accent-primary: #06b6d4;
      --accent-secondary: #818cf8;
      --accent-glow: rgba(6, 182, 212, 0.45);
    }

    /* 19+ yosh: Minimalistik, premium va professional dizayn */
    body.theme-19-plus {
      --bg-gradient: linear-gradient(135deg, #0c0a09 0%, #1c1917 55%, #292524 100%);
      --card-bg: rgba(28, 25, 23, 0.78);
      --card-border: rgba(245, 158, 11, 0.3);
      --text-main: #fafaf9;
      --text-muted: #a8a29e;
      --accent-primary: #f59e0b;
      --accent-secondary: #10b981;
      --accent-glow: rgba(245, 158, 11, 0.35);
    }

    * {
      box-sizing: border-box;
    }

    body {
      font-family: var(--font-body);
      background: var(--bg-gradient);
      background-attachment: fixed;
      color: var(--text-main);
      min-height: 100vh;
      overflow-x: hidden;
      transition: background 0.6s ease, color 0.4s ease;
    }

    h1, h2, h3, h4, .brand-font {
      font-family: var(--font-display);
    }

    /* ==========================================================================
       2. GLASSMORPHISM VA UI KOMPONENTLARI
       ========================================================================== */
    .glass-card {
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--card-border);
      border-radius: 22px;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.22);
      transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.3s ease, border-color 0.3s ease;
    }

    .glass-card-hover:hover {
      transform: translateY(-6px) scale(1.01);
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.32), 0 0 20px var(--accent-glow);
      border-color: rgba(255, 255, 255, 0.45);
    }

    .glass-navbar {
      background: rgba(15, 23, 42, 0.72);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.12);
    }

    body.theme-5-7 .glass-navbar {
      background: rgba(255, 255, 255, 0.78);
      border-bottom: 1px solid rgba(0, 0, 0, 0.08);
    }

    .nav-pill-btn {
      color: var(--text-main);
      border-radius: 14px;
      padding: 8px 14px;
      font-weight: 600;
      transition: all 0.25s ease;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      border: 1px solid transparent;
    }

    .nav-pill-btn:hover, .nav-pill-btn.active {
      background: var(--accent-primary);
      color: #ffffff !important;
      box-shadow: 0 6px 18px var(--accent-glow);
      transform: translateY(-1px);
    }

    .btn-brain {
      background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
      color: #ffffff;
      border: none;
      border-radius: 16px;
      padding: 12px 26px;
      font-weight: 700;
      letter-spacing: 0.3px;
      box-shadow: 0 8px 24px var(--accent-glow);
      transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
      cursor: pointer;
    }

    .btn-brain:hover {
      transform: translateY(-3px) scale(1.03);
      box-shadow: 0 14px 30px var(--accent-glow);
      color: #ffffff;
    }

    .btn-brain:active {
      transform: scale(0.97);
    }

    .btn-glass {
      background: rgba(255, 255, 255, 0.14);
      color: var(--text-main);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      padding: 10px 20px;
      font-weight: 600;
      transition: all 0.25s ease;
      cursor: pointer;
    }

    .btn-glass:hover {
      background: rgba(255, 255, 255, 0.25);
      color: var(--text-main);
      transform: translateY(-2px);
    }

    /* ==========================================================================
       3. ANIMATSIYALAR (ANIMATIONS)
       ========================================================================== */
    @keyframes floatSlow {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-14px) rotate(3deg); }
    }

    @keyframes pulseGlow {
      0%, 100% { filter: drop-shadow(0 0 12px rgba(99, 102, 241, 0.6)); transform: scale(1); }
      50% { filter: drop-shadow(0 0 26px rgba(236, 72, 153, 0.85)); transform: scale(1.05); }
    }

    @keyframes shakeWrong {
      0%, 100% { transform: translateX(0); }
      20% { transform: translateX(-10px); }
      40% { transform: translateX(10px); }
      60% { transform: translateX(-7px); }
      80% { transform: translateX(7px); }
    }

    @keyframes popCorrect {
      0% { transform: scale(1); }
      40% { transform: scale(1.06); }
      100% { transform: scale(1); }
    }

    @keyframes starFloatUp {
      0% { opacity: 1; transform: translateY(0) scale(0.8); }
      100% { opacity: 0; transform: translateY(-75px) scale(1.4); }
    }

    @keyframes fadeInSlide {
      from { opacity: 0; transform: translateY(16px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .animate-float {
      animation: floatSlow 4.5s ease-in-out infinite;
    }

    .animate-brain-glow {
      animation: pulseGlow 3.2s ease-in-out infinite;
    }

    .anim-correct {
      animation: popCorrect 0.45s ease;
      box-shadow: 0 0 0 4px rgba(16, 185, 129, 0.65), 0 0 32px rgba(16, 185, 129, 0.5) !important;
      border-color: #10b981 !important;
    }

    .anim-wrong {
      animation: shakeWrong 0.45s ease;
      box-shadow: 0 0 0 4px rgba(239, 68, 68, 0.65), 0 0 32px rgba(239, 68, 68, 0.5) !important;
      border-color: #ef4444 !important;
    }

    .page-transition {
      animation: fadeInSlide 0.38s ease-out forwards;
    }

    .floating-star {
      position: fixed;
      pointer-events: none;
      z-index: 9999;
      font-weight: 800;
      font-size: 1.35rem;
      color: #fbbf24;
      text-shadow: 0 2px 10px rgba(0,0,0,0.45);
      animation: starFloatUp 0.95s ease-out forwards;
    }

    /* ==========================================================================
       4. YOSH KATEGORIYASI KARTALARI DIZAYNI
       ========================================================================== */
    .age-card-5-7 {
      background: linear-gradient(135deg, #ff6b6b 0%, #feca57 100%);
      color: #1e1b4b;
    }
    .age-card-7-13 {
      background: linear-gradient(135deg, #3b82f6 0%, #8b5cf6 55%, #10b981 100%);
      color: #ffffff;
    }
    .age-card-13-19 {
      background: linear-gradient(135deg, #0f172a 0%, #0284c7 60%, #6366f1 100%);
      color: #ffffff;
    }
    .age-card-19-plus {
      background: linear-gradient(135deg, #1c1917 0%, #44403c 60%, #b45309 100%);
      color: #ffffff;
    }

    /* ==========================================================================
       5. O'YIN ELEMENTLARI (KARTALAR, SUDOKU, SHAXMAT, XOTIRA VA H.K.)
       ========================================================================== */
    .game-option-btn {
      background: rgba(255, 255, 255, 0.14);
      border: 2px solid rgba(255, 255, 255, 0.25);
      color: var(--text-main);
      border-radius: 18px;
      padding: 14px 18px;
      font-size: 1.1rem;
      font-weight: 700;
      transition: all 0.2s ease;
      cursor: pointer;
      width: 100%;
    }
    .game-option-btn:hover:not(:disabled) {
      background: rgba(255, 255, 255, 0.26);
      transform: translateY(-2px);
      border-color: #ffffff;
    }
    .game-option-btn.correct-pick {
      background: #10b981 !important;
      border-color: #6ee7b7 !important;
      color: #ffffff !important;
    }
    .game-option-btn.wrong-pick {
      background: #ef4444 !important;
      border-color: #fca5a5 !important;
      color: #ffffff !important;
    }

    /* Memory Cards Flip */
    .memory-grid {
      display: grid;
      gap: 10px;
      max-width: 480px;
      margin: 0 auto;
    }
    .memory-tile {
      aspect-ratio: 1 / 1;
      border-radius: 16px;
      background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
      border: 2px solid rgba(255,255,255,0.35);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2rem;
      cursor: pointer;
      user-select: none;
      transition: transform 0.25s ease, background 0.25s ease;
      box-shadow: 0 6px 16px rgba(0,0,0,0.25);
    }
    .memory-tile.flipped, .memory-tile.matched {
      background: rgba(255, 255, 255, 0.92);
      color: #1e293b;
      transform: rotateY(180deg) scale(1.02);
    }
    .memory-tile.matched {
      border-color: #10b981;
      box-shadow: 0 0 16px rgba(16, 185, 129, 0.65);
    }

    /* Sliding Number Puzzle */
    .sliding-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      max-width: 310px;
      margin: 0 auto;
    }
    .sliding-tile {
      aspect-ratio: 1 / 1;
      border-radius: 16px;
      font-size: 1.75rem;
      font-weight: 800;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #3b82f6, #6366f1);
      color: #fff;
      border: 2px solid rgba(255,255,255,0.3);
      cursor: pointer;
      transition: transform 0.15s ease;
    }
    .sliding-tile:hover {
      transform: scale(1.04);
    }
    .sliding-tile.empty {
      background: rgba(255,255,255,0.06);
      border: 2px dashed rgba(255,255,255,0.2);
      cursor: default;
    }

    /* Sudoku Grid */
    .sudoku-board {
      display: grid;
      max-width: 360px;
      margin: 0 auto;
      background: rgba(15, 23, 42, 0.85);
      border: 3px solid var(--accent-primary);
      border-radius: 12px;
      overflow: hidden;
    }
    .sudoku-cell {
      aspect-ratio: 1 / 1;
      border: 1px solid rgba(255, 255, 255, 0.2);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.35rem;
      font-weight: 700;
      cursor: pointer;
      color: #38bdf8;
      background: rgba(255, 255, 255, 0.04);
      transition: background 0.15s;
    }
    .sudoku-cell.given {
      color: #f8fafc;
      background: rgba(255, 255, 255, 0.13);
      cursor: default;
    }
    .sudoku-cell.selected {
      background: rgba(56, 189, 248, 0.35);
      outline: 2px solid #38bdf8;
    }
    .sudoku-cell.error-cell {
      background: rgba(239, 68, 68, 0.35);
      color: #fca5a5;
    }

    /* Chess Mini Board */
    .chess-board {
      display: grid;
      grid-template-columns: repeat(8, 1fr);
      max-width: 380px;
      margin: 0 auto;
      border: 3px solid var(--accent-primary);
      border-radius: 12px;
      overflow: hidden;
    }
    .chess-sq {
      aspect-ratio: 1 / 1;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: clamp(1.3rem, 4vw, 1.9rem);
      cursor: pointer;
      user-select: none;
    }
    .chess-sq.light { background: #e2e8f0; color: #0f172a; }
    .chess-sq.dark { background: #64748b; color: #0f172a; }
    .chess-sq.selected { background: #facc15 !important; }
    .chess-sq.hint-move { box-shadow: inset 0 0 0 4px #10b981; }

    /* Matrix Memory / Difference Grid */
    .matrix-grid {
      display: grid;
      gap: 8px;
      max-width: 340px;
      margin: 0 auto;
    }
    .matrix-cell {
      aspect-ratio: 1 / 1;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.14);
      border: 2px solid rgba(255, 255, 255, 0.25);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.5rem;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .matrix-cell.active-flash {
      background: #38bdf8;
      box-shadow: 0 0 18px #38bdf8;
      transform: scale(1.05);
    }
    .matrix-cell.user-picked {
      background: #10b981;
      border-color: #a7f3d0;
    }

    /* Confetti Canvas */
    #confetti-canvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 9998;
    }

    /* Background Decorative Orbs */
    .bg-orb {
      position: fixed;
      border-radius: 50%;
      filter: blur(80px);
      z-index: -1;
      opacity: 0.45;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <!-- Dekorativ fon sharlari -->
  <div class="bg-orb" style="width: 380px; height: 380px; background: #6366f1; top: -80px; left: -100px;"></div>
  <div class="bg-orb" style="width: 340px; height: 340px; background: #ec4899; bottom: -60px; right: -80px;"></div>

  <!-- ========================================================================

  <nav class="navbar navbar-expand-lg glass-navbar sticky-top py-2">

  <!-- ========================================================================
       TOAST / BILDIRISHNOMA KONTEYNERI

  <div id="toastContainer" class="position-fixed bottom-0 end-0 p-3" style="z-index: 10000;"></div>

  <!-- Bootstrap 5 JS Bundle -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <!-- ========================================================================
       PLATFORMANING TO'LIQ MODULLI JAVASCRIPT ARXITEKTURASI
       ======================================================================== -->
  <script>
    "use strict";

    /* ========================================================================
       MODUL 1: STORAGE VA GAMIFICATION (localStorage boshqaruvi)
       ======================================================================== */
    const StorageModule = (() => {
      const STORAGE_KEY = "brainup_platform_v1";

      const defaultState = {
        user: {
          name: "Yosh Daho",
          avatar: "🦊",
          xp: 120,
          streak: 3,
          lastActiveDate: new Date().toISOString().slice(0, 10),
          gamesPlayed: 0,
          totalScore: 0,
          correctAnswers: 0,
          soundEnabled: true
        },
        highScores: {}, // { gameId: bestScore }
        playedGames: [], // unique gameIds played
        unlockedAchievements: ["first_visit"],
        dailyQuests: {
          date: new Date().toISOString().slice(0, 10),
          gamesToday: 0,
          scoreToday: 0,
          hardGamesToday: 0,
          claimed: []
        }
      };

      let state = loadState();

      function loadState() {
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          if (!raw) return JSON.parse(JSON.stringify(defaultState));
          const parsed = JSON.parse(raw);
          const merged = {
            ...defaultState,
            ...parsed,
            user: { ...defaultState.user, ...(parsed.user || {}) },
            dailyQuests: { ...defaultState.dailyQuests, ...(parsed.dailyQuests || {}) }
          };
          // Kunlik yangilanishni tekshirish
          const today = new Date().toISOString().slice(0, 10);
          if (merged.dailyQuests.date !== today) {
            merged.dailyQuests = {
              date: today,
              gamesToday: 0,
              scoreToday: 0,
              hardGamesToday: 0,
              claimed: []
            };
          }
          if (merged.user.lastActiveDate !== today) {
            const yesterday = new Date(Date.now() - 86400000).toISOString().slice(0, 10);
            if (merged.user.lastActiveDate === yesterday) {
              merged.user.streak += 1;
            } else {
              merged.user.streak = 1;
            }
            merged.user.lastActiveDate = today;
          }
          return merged;
        } catch (err) {
          console.error("LocalStorage yuklashda xatolik:", err);
          return JSON.parse(JSON.stringify(defaultState));
        }
      }

      function saveState() {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
          updateHeaderHUD();
        } catch (err) {
          console.error("LocalStorage saqlashda xatolik:", err);
        }
      }

      function getLevelInfo(xp = state.user.xp) {
        const level = Math.floor(xp / 250) + 1;
        const currentLevelXP = xp % 250;
        const nextLevelXP = 250;
        const percent = Math.min(100, Math.round((currentLevelXP / nextLevelXP) * 100));
        return { level, currentLevelXP, nextLevelXP, percent };
      }

      function recordGameResult({ gameId, ageGroup, score, correctCount, xpEarned }) {
        const prevLevel = getLevelInfo().level;
        state.user.xp += xpEarned;
        state.user.gamesPlayed += 1;
        state.user.totalScore += score;
        state.user.correctAnswers += correctCount;

        if (!state.highScores[gameId] || score > state.highScores[gameId]) {
          state.highScores[gameId] = score;
        }
        if (!state.playedGames.includes(gameId)) {
          state.playedGames.push(gameId);
        }

        // Kunlik topshiriqlarni yangilash
        state.dailyQuests.gamesToday += 1;
        state.dailyQuests.scoreToday += score;
        if (ageGroup === "13-19" || ageGroup === "19+") {
          state.dailyQuests.hardGamesToday += 1;
        }

        checkAchievements();
        saveState();

        const newLevel = getLevelInfo().level;
        return { leveledUp: newLevel > prevLevel, newLevel };
      }

      function checkAchievements() {
        const newlyUnlocked = [];
        const rules = [
          { id: "first_visit", cond: () => true },
          { id: "first_game", cond: () => state.user.gamesPlayed >= 1 },
          { id: "five_games", cond: () => state.user.gamesPlayed >= 5 },
          { id: "score_500", cond: () => state.user.totalScore >= 500 },
          { id: "xp_500", cond: () => state.user.xp >= 500 },
          { id: "explorer_5", cond: () => state.playedGames.length >= 5 },
          { id: "streak_3", cond: () => state.user.streak >= 3 },
          { id: "master_10", cond: () => state.playedGames.length >= 10 }
        ];
        rules.forEach(r => {
          if (!state.unlockedAchievements.includes(r.id) && r.cond()) {
            state.unlockedAchievements.push(r.id);
            newlyUnlocked.push(r.id);
          }
        });
        newlyUnlocked.forEach(id => {
          const ach = ACHIEVEMENTS_LIST.find(a => a.id === id);
          if (ach) {
            showToast(`🏆 Yangi yutuq ochildi: ${ach.title}! (+50 XP)`, "success");
            state.user.xp += 50;
          }
        });
      }

      function claimQuest(questId, rewardXP) {
        if (state.dailyQuests.claimed.includes(questId)) return false;
        state.dailyQuests.claimed.push(questId);
        state.user.xp += rewardXP;
        checkAchievements();
        saveState();
        return true;
      }

      function updateProfile(name, avatar) {
        if (name && name.trim()) state.user.name = name.trim().slice(0, 22);
        if (avatar) state.user.avatar = avatar;
        saveState();
      }

      function toggleSound() {
        state.user.soundEnabled = !state.user.soundEnabled;
        saveState();
        return state.user.soundEnabled;
      }

      function resetAll() {
        state = JSON.parse(JSON.stringify(defaultState));
        saveState();
      }

      return {
        getState: () => state,
        getLevelInfo,
        recordGameResult,
        claimQuest,
        updateProfile,
        toggleSound,
        resetAll
      };
    })();

    const SoundFX = (() => {
      let audioCtx = null;

      function getCtx() {
        if (!audioCtx) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          if (AudioContext) audioCtx = new AudioContext();
        }
        if (audioCtx && audioCtx.state === "suspended") {
          audioCtx.resume();
        }
        return audioCtx;
      }

      function playTone(freq, type = "sine", duration = 0.15, delay = 0) {
        if (!StorageModule.getState().user.soundEnabled) return;
        try {
          const ctx = getCtx();
          if (!ctx) return;
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = type;
          osc.frequency.setValueAtTime(freq, ctx.currentTime + delay);
          gain.gain.setValueAtTime(0.14, ctx.currentTime + delay);
          gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + delay + duration);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(ctx.currentTime + delay);
          osc.stop(ctx.currentTime + delay + duration);
        } catch (e) { /* ignore audio block */ }
      }

      return {
        click: () => playTone(520, "sine", 0.08),
        correct: () => {
          playTone(523.25, "triangle", 0.12, 0);
          playTone(659.25, "triangle", 0.12, 0.08);
          playTone(783.99, "triangle", 0.22, 0.16);
        },
        wrong: () => {
          playTone(220, "sawtooth", 0.16, 0);
          playTone(175, "sawtooth", 0.24, 0.12);
        },
        win: () => {
          [523.25, 659.25, 783.99, 1046.5].forEach((f, idx) => {
            playTone(f, "triangle", 0.2, idx * 0.1);
          });
        }
      };
    })();

    function launchConfetti() {
      const canvas = document.getElementById("confetti-canvas");
      const ctx = canvas.getContext("2d");
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;

      const colors = ["#ff6b6b", "#feca57", "#48dbfb", "#1dd1a1", "#a29bfe", "#ff9ff3"];
      const particles = Array.from({ length: 110 }, () => ({
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height - canvas.height,
        w: Math.random() * 10 + 6,
        h: Math.random() * 6 + 4,
        color: colors[Math.floor(Math.random() * colors.length)],
        vy: Math.random() * 4 + 2.5,
        vx: (Math.random() - 0.5) * 3,
        rot: Math.random() * 360,
        vRot: (Math.random() - 0.5) * 8
      }));

      let frames = 0;
      function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        particles.forEach(p => {
          p.y += p.vy;
          p.x += p.vx;
          p.rot += p.vRot;
          ctx.save();
          ctx.translate(p.x, p.y);
          ctx.rotate((p.rot * Math.PI) / 180);
          ctx.fillStyle = p.color;
          ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
          ctx.restore();
        });
        frames++;
        if (frames < 140) {
          requestAnimationFrame(draw);
        } else {
          ctx.clearRect(0, 0, canvas.width, canvas.height);
        }
      }
      draw();
    }

    function spawnFloatingStar(text = "+20 ⭐", targetEl = null) {
      const el = document.createElement("div");
      el.className = "floating-star";
      el.textContent = text;
      if (targetEl) {
        const rect = targetEl.getBoundingClientRect();
        el.style.left = `${rect.left + rect.width / 2 - 25}px`;
        el.style.top = `${rect.top}px`;
      } else {
        el.style.left = "50%";
        el.style.top = "40%";
      }
      document.body.appendChild(el);
      setTimeout(() => el.remove(), 950);
    }

    function showToast(message, type = "info") {
      const container = document.getElementById("toastContainer");
      const toast = document.createElement("div");
      const bg = type === "success" ? "bg-success" : type === "warning" ? "bg-warning text-dark" : "bg-primary";
      toast.className = `toast show align-items-center text-white ${bg} border-0 rounded-4 shadow-lg mb-2`;
      toast.innerHTML = `
        <div class="d-flex">
          <div class="toast-body fw-semibold">${message}</div>
          <button type="button" class="btn-close btn-close-white me-2 m-auto" onclick="this.closest('.toast').remove()"></button>
        </div>
      `;
      container.appendChild(toast);
      setTimeout(() => toast.remove(), 4200);
    }

      slidingPuzzle(ctx) {
        // Yechiladigan 3x3 holatni tasodifiy yurishlar bilan hosil qilamiz
        let board = [1, 2, 3, 4, 5, 6, 7, 8, 0];
        let emptyIdx = 8;
        const movesCount = 18 + ctx.round * 6;
        for (let m = 0; m < movesCount; m++) {
          const r = Math.floor(emptyIdx / 3), c = emptyIdx % 3;
          const neighbors = [];
          if (r > 0) neighbors.push(emptyIdx - 3);
          if (r < 2) neighbors.push(emptyIdx + 3);
          if (c > 0) neighbors.push(emptyIdx - 1);
          if (c < 2) neighbors.push(emptyIdx + 1);
          const pick = neighbors[Math.floor(Math.random() * neighbors.length)];
          [board[emptyIdx], board[pick]] = [board[pick], board[emptyIdx]];
          emptyIdx = pick;
        }

        function render() {
          ctx.stageEl.innerHTML = `
            <p class="text-center fw-semibold mb-3">1 dan 8 gacha raqamlarni tartib bilan joylashtiring:</p>
            <div class="sliding-grid">
              ${board.map((val, idx) => `
                <div class="sliding-tile ${val === 0 ? 'empty' : ''}" data-idx="${idx}">
                  ${val === 0 ? '' : val}
                </div>
              `).join("")}
            </div>
          `;
          ctx.stageEl.querySelectorAll(".sliding-tile").forEach(tile => {
            tile.onclick = () => {
              const idx = Number(tile.dataset.idx);
              if (board[idx] === 0) return;
              const r1 = Math.floor(idx / 3), c1 = idx % 3;
              const r2 = Math.floor(emptyIdx / 3), c2 = emptyIdx % 3;
              if (Math.abs(r1 - r2) + Math.abs(c1 - c2) === 1) {
                SoundFX.click();
                [board[emptyIdx], board[idx]] = [board[idx], board[emptyIdx]];
                emptyIdx = idx;
                render();
                if (board.slice(0, 8).every((v, i) => v === i + 1)) {
                  setTimeout(() => ctx.submitAnswer(true, null), 350);
                }
              }
            };
          });
        }
        render();
      },

      function startSession() {
        SoundFX.click();
        document.getElementById("preGameScreen").classList.add("d-none");
        document.getElementById("resultGameScreen").classList.add("d-none");
        document.getElementById("activeGameScreen").classList.remove("d-none");

        const totalRounds = 5;
        let round = 1;
        let score = 0;
        let correctCount = 0;
        let timeLeft = game.timeLimit;
        let roundLocked = false;

        const arenaCard = document.getElementById("gameArenaCard");
        const stageEl = document.getElementById("gameStage");
        const hudScore = document.getElementById("hudScore");
        const hudRound = document.getElementById("hudRound");
        const hudTimer = document.getElementById("hudTimer");
        const hudProgress = document.getElementById("hudProgress");

        function updateHUD() {
          hudScore.textContent = score;
          hudRound.textContent = `${round} / ${totalRounds}`;
          hudProgress.style.width = `${Math.round((round / totalRounds) * 100)}%`;
        }

        function loadRound() {
          roundLocked = false;
          updateHUD();
          const engineFn = GameEngines[game.engine];
          if (engineFn) {
            engineFn({
              stageEl,
              round,
              submitAnswer(isCorrect, clickedEl) {
                if (roundLocked) return;
                roundLocked = true;

                arenaCard.classList.remove("anim-correct", "anim-wrong");
                void arenaCard.offsetWidth;

                if (isCorrect) {
                  SoundFX.correct();
                  const gain = 25 + Math.max(0, Math.floor(timeLeft / 5));
                  score += gain;
                  correctCount++;
                  arenaCard.classList.add("anim-correct");
                  if (clickedEl) clickedEl.classList.add("correct-pick");
                  spawnFloatingStar(`+${gain} ⭐`, clickedEl || stageEl);
                } else {
                  SoundFX.wrong();
                  arenaCard.classList.add("anim-wrong");
                  if (clickedEl) clickedEl.classList.add("wrong-pick");
                }

                hudScore.textContent = score;

                setTimeout(() => {
                  arenaCard.classList.remove("anim-correct", "anim-wrong");
                  if (round < totalRounds) {
                    round++;
                    loadRound();
                  } else {
                    finishSession();
                  }
                }, 700);
              }
            });
          }
        }

        clearActiveTimer();
        hudTimer.textContent = `${timeLeft}s`;
        activeTimerInterval = setInterval(() => {
          timeLeft--;
          hudTimer.textContent = `${timeLeft}s`;
          if (timeLeft <= 10) hudTimer.classList.replace("text-info", "text-danger");
          if (timeLeft <= 0) {
            finishSession();
          }
        }, 1000);

        function finishSession() {
          clearActiveTimer();
          SoundFX.win();
          launchConfetti();

          const accuracy = Math.round((correctCount / totalRounds) * 100);
          const xpEarned = Math.max(25, Math.round(score * 0.8) + correctCount * 10);
          const res = StorageModule.recordGameResult({
            gameId: game.id,
            ageGroup: game.age,
            score,
            correctCount,
            xpEarned
          });

          document.getElementById("activeGameScreen").classList.add("d-none");
          document.getElementById("resultGameScreen").classList.remove("d-none");

          document.getElementById("resScore").textContent = score;
          document.getElementById("resAccuracy").textContent = `${accuracy}%`;
          document.getElementById("resXP").textContent = `+${xpEarned}`;
          document.getElementById("resEmoji").textContent = accuracy >= 80 ? "🏆" : accuracy >= 40 ? "🎉" : "💪";
          document.getElementById("resTitle").textContent = accuracy >= 80 ? "Mukammal Natija!" : accuracy >= 40 ? "Yaxshi Harakat!" : "Mashq Qilishda Davom Eting!";

          const lvlBanner = document.getElementById("levelUpBanner");
          if (res.leveledUp) {
            lvlBanner.classList.remove("d-none");
            lvlBanner.textContent = `🎊 TABRIKLAYMIZ! Siz ${res.newLevel}-darajaga (Level ${res.newLevel}) ko‘tarildingiz!`;
          } else {
            lvlBanner.classList.add("d-none");
          }
        }

        loadRound();
      }
    }

    function renderDailyQuestsWidget() {
      const container = document.getElementById("dailyQuestsContainer");
      if (!container) return;
      const dq = StorageModule.getState().dailyQuests;

      const quests = [
        {
          id: "q_3games",
          title: "Bugun 3 ta o‘yin o‘ynang",
          progress: Math.min(3, dq.gamesToday),
          target: 3,
          reward: 60
        },
        {
          id: "q_200pts",
          title: "Bugun 200 ball to‘plang",
          progress: Math.min(200, dq.scoreToday),
          target: 200,
          reward: 80
        },
        {
          id: "q_hard1",
          title: "13+ toifadagi 1 ta qiyin o‘yinni yakunlang",
          progress: Math.min(1, dq.hardGamesToday),
          target: 1,
          reward: 100
        }
      ];

      container.innerHTML = quests.map(q => {
        const done = q.progress >= q.target;
        const claimed = dq.claimed.includes(q.id);
        const pct = Math.round((q.progress / q.target) * 100);
        return `
          <div class="col-12 col-md-4">
            <div class="p-3 rounded-4 bg-white bg-opacity-10 h-100 d-flex flex-column justify-content-between">
              <div>
                <div class="d-flex justify-content-between align-items-center mb-2">
                  <span class="fw-bold small">${q.title}</span>
                  <span class="badge bg-success">+${q.reward} XP</span>
                </div>
                <div class="progress rounded-pill mb-2" style="height: 8px; background: rgba(255,255,255,0.15);">
                  <div class="progress-bar bg-warning" style="width: ${pct}%"></div>
                </div>
              </div>
              <div class="d-flex justify-content-between align-items-center mt-2">
                <small class="opacity-75">${q.progress} / ${q.target}</small>
                ${claimed
                  ? `<span class="badge bg-secondary">Olingan ✓</span>`
                  : done
                    ? `<button class="btn btn-sm btn-warning fw-bold rounded-pill px-3" onclick="handleClaimQuest('${q.id}', ${q.reward})">Mukofotni olish</button>`
                    : `<span class="small opacity-50">Jarayonda...</span>`
                }
              </div>
            </div>
          </div>
        `;
      }).join("");
    }

    window.handleClaimQuest = function(id, reward) {
      if (StorageModule.claimQuest(id, reward)) {
        SoundFX.win();
        spawnFloatingStar(`+${reward} XP ⭐`);
        showToast(`Kunlik topshiriq mukofoti (+${reward} XP) qo‘shildi!`, "success");
        renderDailyQuestsWidget();
      }
    };

              </div>
            </div>
            <div class="text-center mt-4">
              <a href="#games" class="btn-brain px-4 py-3 text-decoration-none">O‘yinlarni sinab ko‘rish</a>
            </div>
          </div>
        </div>
      `;
    }

    /* ========================================================================
       MODUL 8: CLIENT-SIDE SPA ROUTER VA INITIALIZATION
       ======================================================================== */
    function navigateTo(hashPath) {
      window.location.hash = hashPath;
    }

    function handleRoute() {
      clearActiveTimer();
      const rawHash = window.location.hash.replace(/^#/, "") || "home";
      const [route, param] = rawHash.split("/");

      // Navbar active holatini yangilash
      document.querySelectorAll(".nav-pill-btn[data-route]").forEach(link => {
        link.classList.toggle("active", link.dataset.route === route);
      });

      // Mobil menyuni yopish
      const navCollapse = document.getElementById("mainNavbar");
      if (navCollapse && navCollapse.classList.contains("show")) {
        const bsCollapse = bootstrap.Collapse.getInstance(navCollapse);
        if (bsCollapse) bsCollapse.hide();
      }

      window.scrollTo({ top: 0, behavior: "smooth" });

      switch (route) {
        case "home":
          renderHomePage();
          break;
        case "games":
          renderAllGamesPage("all", "");
          break;
        case "category":
          renderCategoryPage(param || "5-7");
          break;
        case "game":
          renderGameArena(param);
          break;
        case "leaderboard":
          renderLeaderboardPage();
          break;
        case "achievements":
          renderAchievementsPage();
          break;
        case "profile":
          renderProfilePage();
          break;
        case "about":
          renderAboutPage();
          break;
        default:
          renderHomePage();
      }
    }

    // Dastur ishga tushishi
    window.addEventListener("hashchange", handleRoute);
    window.addEventListener("DOMContentLoaded", () => {
      updateHeaderHUD();
      document.getElementById("soundToggleBtn").onclick = () => {
        const enabled = StorageModule.toggleSound();
        showToast(enabled ? "Ovoz effektlari yoqildi 🔊" : "Ovoz effektlari o‘chirildi 🔇", "info");
      };
      handleRoute();
    });
  </script>
</body>
</html>
